<div class="sidebar-root">
  <!-- ================= BRAND ================= -->
  <div class="sidebar-header">
    <img
      src="/assets/images/vinoagent_logo.png"
      alt="VinoAgent"
      class="sidebar-logo"
      (click)="onLogoClick()"
    />

    <button class="new-chat-btn" (click)="addNewChat()">
      <span class="icon">✏️</span>
      <span>New Chat</span>
    </button>
  </div>

  <!-- ================= CHATS ================= -->
  <div class="sidebar-section">
    <div class="section-title">Chats</div>

    <div class="chat-list">
      <div
        class="chat-item"
        *ngFor="let session of chatNames"
        [class.active]="session.id === selectedSessionId"
        (click)="onSelectSession(session)"
      >
        <span class="chat-title"> {{ session.title || session.id }} </span>

        <button class="chat-options" (click)="openMenu($event, session)">
          ⋮
        </button>
      </div>
    </div>
  </div>

  <!-- ================= MENU ================= -->
  <div
    *ngIf="menuOpen"
    class="dropdown-menu"
    [style.top.px]="menuPosition.y"
    [style.left.px]="menuPosition.x"
  >
    <button class="menu-item delete" (click)="delete(selectedSession)">
      Delete
    </button>
  </div>
</div>
